<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">c-a-p-engineer — engineer the workflow, ship the result</title>
  <desc id="desc">Brand banner for c-a-p-engineer with the message Engineer the workflow. Ship the result.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070C"/>
      <stop offset="0.55" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#130A18"/>
    </linearGradient>
    <linearGradient id="accent" x1="76" y1="0" x2="1108" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.48" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#FF4F9A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#8B949E" stroke-opacity="0.07"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="29.25" stroke="url(#accent)" stroke-opacity="0.32" stroke-width="1.5"/>

  <circle cx="1030" cy="74" r="118" fill="#FF4F9A" fill-opacity="0.06"/>
  <circle cx="1120" cy="310" r="170" fill="#58A6FF" fill-opacity="0.05"/>
  <circle cx="140" cy="342" r="130" fill="#A371F7" fill-opacity="0.05"/>

  <g transform="translate(70 60)">
    <text x="0" y="0" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.6">c-a-p-engineer // PROFILE</text>

    <text x="0" y="70" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="850" letter-spacing="1.6">ENGINEER THE WORKFLOW.</text>
    <text x="0" y="126" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="850" letter-spacing="1.6">SHIP THE RESULT.</text>

    <rect x="0" y="150" width="640" height="5" rx="2.5" fill="url(#accent)"/>
    <rect x="0" y="148" width="640" height="9" rx="4.5" fill="url(#accent)" opacity="0.18" filter="url(#softGlow)"/>

    <text x="0" y="195" fill="#C9D1D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" letter-spacing="0.8">SOFTWARE SYSTEMS · AUTOMATION · CREATIVE TOOLING</text>
    <text x="0" y="235" fill="#7D8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600">intent → spec → build → verify → ship</text>
  </g>

  <g transform="translate(830 70)">
    <rect width="300" height="220" rx="20" fill="#0D1117" fill-opacity="0.86" stroke="#30363D"/>
    <rect width="300" height="38" rx="20" fill="#111827"/>
    <path d="M0 38H300" stroke="#30363D"/>
    <circle cx="20" cy="19" r="5" fill="#FF6B6B"/>
    <circle cx="38" cy="19" r="5" fill="#FFD166"/>
    <circle cx="56" cy="19" r="5" fill="#3FB950"/>
    <text x="78" y="24" fill="#7D8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">build.sh</text>

    <text x="20" y="74" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">$ define --problem</text>
    <text x="20" y="104" fill="#A371F7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">$ specify --intent</text>
    <text x="20" y="134" fill="#FF4F9A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">$ build --with-ai</text>
    <text x="20" y="164" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">$ verify --evidence</text>
    <text x="20" y="194" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800">✓ shipped</text>
  </g>
</svg>
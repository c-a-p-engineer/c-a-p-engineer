<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Engineering delivery pipeline</title>
  <desc id="desc">Intent becomes specification, AI-assisted implementation, verification, and a shipped result.</desc>
  <defs>
    <linearGradient id="bg" x1="20" y1="0" x2="1180" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070C"/>
      <stop offset="0.56" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#130A18"/>
    </linearGradient>
    <linearGradient id="flow" x1="84" y1="0" x2="1116" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.45" stop-color="#A371F7"/>
      <stop offset="0.76" stop-color="#FF4F9A"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#8B949E" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="27.25" stroke="url(#flow)" stroke-opacity="0.30" stroke-width="1.5"/>

  <text x="56" y="52" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="1.2">DELIVERY PIPELINE</text>
  <text x="56" y="78" fill="#7D8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">human judgment + AI execution + evidence-based verification</text>

  <path d="M116 176H1084" stroke="#30363D" stroke-width="6" stroke-linecap="round"/>
  <path d="M116 176H1084" stroke="url(#flow)" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(72 116)">
    <rect width="190" height="120" rx="18" fill="#0D1117" stroke="#58A6FF" stroke-opacity="0.72"/>
    <text x="20" y="30" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800">01 / INTENT</text>
    <text x="20" y="62" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Find the problem</text>
    <text x="20" y="90" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Goal · context · constraint</text>
  </g>

  <g transform="translate(286 116)">
    <rect width="190" height="120" rx="18" fill="#0D1117" stroke="#7C6AEF" stroke-opacity="0.72"/>
    <text x="20" y="30" fill="#7C6AEF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800">02 / SPEC</text>
    <text x="20" y="62" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Make it explicit</text>
    <text x="20" y="90" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Scope · contract · tasks</text>
  </g>

  <g transform="translate(500 116)">
    <rect width="190" height="120" rx="18" fill="#0D1117" stroke="#A371F7" stroke-opacity="0.72"/>
    <text x="20" y="30" fill="#A371F7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800">03 / BUILD</text>
    <text x="20" y="62" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Use AI as force</text>
    <text x="20" y="90" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Code · automate · compose</text>
  </g>

  <g transform="translate(714 116)">
    <rect width="190" height="120" rx="18" fill="#0D1117" stroke="#FF4F9A" stroke-opacity="0.72"/>
    <text x="20" y="30" fill="#FF4F9A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800">04 / VERIFY</text>
    <text x="20" y="62" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Check reality</text>
    <text x="20" y="90" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Test · inspect · evidence</text>
  </g>

  <g transform="translate(928 116)">
    <rect width="190" height="120" rx="18" fill="#0D1117" stroke="#3FB950" stroke-opacity="0.78"/>
    <text x="20" y="30" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800">05 / SHIP</text>
    <text x="20" y="62" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Deliver repeatably</text>
    <text x="20" y="90" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">CI · release · learn</text>
  </g>
</svg>